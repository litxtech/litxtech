<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Trabzon Live city guide mobile app with places and events">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0805"/>
      <stop offset="0.5" stop-color="#0d0b07"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <radialGradient id="m-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#16130e"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="m-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a12"/>
      <stop offset="0.5" stop-color="#4a3a1c"/>
      <stop offset="1" stop-color="#152a33"/>
