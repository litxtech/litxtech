    <linearGradient id="m-glass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="m-clip"><rect x="392" y="67" width="236" height="616" rx="28"/></clipPath>
    <clipPath id="m-map"><rect x="690" y="410" width="392" height="192" rx="18"/></clipPath>
