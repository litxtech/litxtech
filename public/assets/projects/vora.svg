<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Vora city news and community app interface with map">
  <defs>
    <linearGradient id="vo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b13"/>
      <stop offset="0.5" stop-color="#070e18"/>
      <stop offset="1" stop-color="#081019"/>
    </linearGradient>
    <radialGradient id="vo-sky" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vo-indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vo-screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1826"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <linearGradient id="vo-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a56"/>
      <stop offset="0.55" stop-color="#155e75"/>
      <stop offset="1" stop-color="#122a4d"/>
    </linearGradient>
    <linearGradient id="vo-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a4a"/>
      <stop offset="1" stop-color="#0b2036"/>
    </linearGradient>
    <linearGradient id="vo-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="vo-glass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="vo-clip"><rect x="392" y="67" width="236" height="616" rx="28"/></clipPath>
    <clipPath id="vo-map"><rect x="690" y="140" width="392" height="300" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#vo-bg)"/>
  <ellipse cx="980" cy="230" rx="430" ry="320" fill="url(#vo-sky)"/>
  <ellipse cx="300" cy="640" rx="420" ry="300" fill="url(#vo-indigo)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200"/>
    <path d="M150 0V750M300 0V750M450 0V750M600 0V750M750 0V750M900 0V750M1050 0V750"/>
  </g>

  <!-- phone -->
  <rect x="380" y="62" width="260" height="646" rx="40" fill="#000" opacity="0.55"/>
  <rect x="380" y="55" width="260" height="640" rx="40" fill="#070d16" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1.5"/>
  <rect x="392" y="67" width="236" height="616" rx="28" fill="url(#vo-screen)"/>

  <g clip-path="url(#vo-clip)">
    <text x="410" y="90" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">9:41</text>
    <rect x="586" y="84" width="18" height="8" rx="2.4" fill="none" stroke="#dbeafe" stroke-opacity="0.55"/>
    <rect x="588" y="86" width="12" height="4" rx="1.2" fill="#dbeafe" opacity="0.8"/>
    <rect x="430" y="79" width="60" height="18" rx="9" fill="#050b14"/>

    <!-- header -->
    <text x="412" y="128" fill="#f0f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0.4">Vora</text>
    <text x="412" y="142" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7" letter-spacing="2.2">CITY · COMMUNITY</text>
    <circle cx="610" cy="126" r="12" fill="url(#vo-glass)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="610" cy="123" r="3.2" fill="none" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M605 131h10" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round"/>

    <!-- city hero -->
    <rect x="408" y="158" width="204" height="130" rx="16" fill="url(#vo-hero)"/>
    <g opacity="0.55">
      <path d="M408 250c34-30 62-24 92-46s66-20 112 8v76H408z" fill="#071a2a" opacity="0.7"/>
      <path d="M470 288v-46a10 10 0 0 1 10-10h26a10 10 0 0 1 10 10v46z" fill="#061420" opacity="0.8"/>
      <path d="M522 288v-64a8 8 0 0 1 8-8h20a8 8 0 0 1 8 8v64z" fill="#08202f" opacity="0.85"/>
      <path d="M568 288v-38a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v38z" fill="#061420" opacity="0.8"/>
    </g>
    <rect x="408" y="158" width="204" height="130" rx="16" fill="none" stroke="#7dd3fc" stroke-opacity="0.16"/>
    <rect x="422" y="172" width="70" height="16" rx="8" fill="#04121f" fill-opacity="0.7"/>
    <circle cx="431" cy="180" r="2.6" fill="#38bdf8"/>
    <text x="438" y="183" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.6" letter-spacing="0.8">LIVE · TRABZON</text>
    <text x="422" y="232" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">What's happening nearby</text>
    <text x="422" y="248" fill="#b6d7ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">Local news, events and neighbors</text>
    <rect x="422" y="258" width="76" height="20" rx="10" fill="url(#vo-accent)"/>
    <text x="460" y="271.5" fill="#03121c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Explore</text>

    <!-- feed -->
    <text x="408" y="312" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7" letter-spacing="1.8">CITY FEED</text>

    <g>
      <rect x="408" y="320" width="204" height="70" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="418" y="330" width="52" height="50" rx="9" fill="#0d3a56"/>
      <path d="M430 372l10-14 8 10 6-7 6 11z" fill="#38bdf8" fill-opacity="0.5"/>
      <circle cx="436" cy="341" r="4" fill="#fcd34d" fill-opacity="0.7"/>
      <rect x="480" y="336" width="112" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="480" y="349" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="480" y="363" width="46" height="13" rx="6.5" fill="#38bdf8" fill-opacity="0.14"/>
      <text x="503" y="372.5" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.2" text-anchor="middle">NEWS</text>
      <text x="600" y="372.5" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.4" text-anchor="end">2h</text>
    </g>

    <g>
      <rect x="408" y="398" width="204" height="70" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="418" y="408" width="52" height="50" rx="9" fill="#122a4d"/>
      <g stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="1.2" fill="none">
        <circle cx="444" cy="428" r="7"/><circle cx="436" cy="440" r="4.6"/>
      </g>
      <rect x="480" y="414" width="98" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="480" y="427" width="118" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="480" y="441" width="52" height="13" rx="6.5" fill="#818cf8" fill-opacity="0.16"/>
      <text x="506" y="450.5" fill="#a5b4fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.2" text-anchor="middle">EVENT</text>
      <text x="600" y="450.5" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.4" text-anchor="end">5h</text>
    </g>

    <g>
      <rect x="408" y="476" width="204" height="70" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="418" y="486" width="52" height="50" rx="9" fill="#0b3a4a"/>
      <path d="M430 518c6-12 14-18 14-18s8 6 14 18z" fill="#34d399" fill-opacity="0.35"/>
      <rect x="480" y="492" width="104" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="480" y="505" width="76" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="480" y="519" width="58" height="13" rx="6.5" fill="#34d399" fill-opacity="0.14"/>
      <text x="509" y="528.5" fill="#6ee7b7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.2" text-anchor="middle">PLACES</text>
    </g>

    <!-- bottom nav -->
    <rect x="392" y="630" width="236" height="53" fill="#050b14" opacity="0.92"/>
    <rect x="392" y="630" width="236" height="1" fill="#ffffff" fill-opacity="0.06"/>
    <g stroke="#5b7d96" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M435 650l-5 5 5 5 5-5z"/>
      <circle cx="496" cy="655" r="5"/><path d="M496 660v3"/>
      <path d="M553 652h10v10h-10z" />
      <circle cx="608" cy="654" r="4"/><path d="M608 650v-2"/>
    </g>
    <circle cx="435" cy="666" r="2" fill="#38bdf8"/>
    <path d="M435 655l-4 4 4 4 4-4z" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
  </g>

  <!-- map panel -->
  <rect x="682" y="132" width="408" height="316" rx="24" fill="#000" opacity="0.4"/>
  <rect x="690" y="140" width="392" height="300" rx="20" fill="url(#vo-sea)" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#vo-map)">
    <g stroke="#7dd3fc" stroke-opacity="0.12" fill="none" stroke-width="1">
      <path d="M690 200h392M690 260h392M690 320h392M690 380h392"/>
      <path d="M760 140v300M830 140v300M900 140v300M970 140v300M1040 140v300"/>
    </g>
    <path d="M690 392c60-30 96-8 140-34s80-30 122-16 68-4 130-14v112H690z" fill="#0a3a52" opacity="0.65"/>
    <path d="M690 402c60-28 96-6 140-32s80-28 122-14 68-2 130-12" stroke="#38bdf8" stroke-opacity="0.35" fill="none" stroke-width="1.6"/>
    <g stroke="#a5b4fc" stroke-opacity="0.35" fill="none" stroke-width="2">
      <path d="M714 420c46-64 92-52 126-96s72-96 130-104"/>
      <path d="M782 440c14-60 70-70 104-118s58-70 96-78"/>
    </g>
    <circle cx="926" cy="268" r="34" fill="#38bdf8" fill-opacity="0.14"/>
    <circle cx="926" cy="268" r="20" fill="#38bdf8" fill-opacity="0.2"/>
    <path d="M926 248c8.8 0 16 7 16 15.6 0 11-16 26.4-16 26.4s-16-15.4-16-26.4c0-8.6 7.2-15.6 16-15.6z" fill="#38bdf8"/>
    <circle cx="926" cy="263" r="5.6" fill="#061c2b"/>
    <g fill="#7dd3fc">
      <circle cx="824" cy="212" r="3.4"/><circle cx="1010" cy="330" r="3.4"/><circle cx="878" cy="368" r="3.4"/>
    </g>
    <rect x="706" y="156" width="96" height="26" rx="13" fill="#04121f" fill-opacity="0.85"/>
    <circle cx="722" cy="169" r="3.4" fill="#38bdf8"/>
    <text x="732" y="172.5" fill="#cfe9f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">Nearby now</text>
  </g>
  <rect x="690" y="140" width="392" height="300" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- stats card -->
  <g>
    <rect x="690" y="470" width="392" height="120" rx="20" fill="#070f18" stroke="#ffffff" stroke-opacity="0.1"/>
    <g>
      <text x="716" y="500" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" letter-spacing="1.6">LOCAL REACH</text>
      <text x="716" y="532" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">68K</text>
      <text x="716" y="550" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">monthly readers</text>
    </g>
    <path d="M880 530v-46" stroke="#ffffff" stroke-opacity="0.08"/>
    <g>
      <text x="906" y="500" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" letter-spacing="1.6">CITIES</text>
      <text x="906" y="532" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">9</text>
      <text x="906" y="550" fill="#5b8fb0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">Black Sea region</text>
    </g>
    <g>
      <rect x="972" y="486" width="88" height="42" rx="12" fill="#ffffff" fill-opacity="0.03"/>
      <text x="986" y="504" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7">Latency</text>
      <text x="986" y="520" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">42ms</text>
    </g>
  </g>

  <g>
    <rect x="120" y="510" width="216" height="84" rx="18" fill="#070f18" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="152" cy="546" r="16" fill="#0e3a56"/>
    <path d="M152 538c5.6 0 10 4.6 10 10.2 0 7-10 16.4-10 16.4s-10-9.4-10-16.4c0-5.6 4.4-10.2 10-10.2z" fill="#38bdf8" fill-opacity="0.85"/>
    <text x="178" y="542" fill="#eaf6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Hyperlocal feed</text>
    <text x="178" y="558" fill="#6b93ad" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8">City by city, in real time</text>
    <rect x="140" y="570" width="176" height="4" rx="2" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="140" y="570" width="112" height="4" rx="2" fill="url(#vo-accent)"/>
  </g>
</svg>
