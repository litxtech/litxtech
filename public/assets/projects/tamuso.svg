<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Tamuso live voice rooms interface with speakers and waveform">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0713"/>
      <stop offset="0.5" stop-color="#0c0818"/>
      <stop offset="1" stop-color="#0d0a1c"/>
    </linearGradient>
    <radialGradient id="t-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="t-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#171029"/>
      <stop offset="0.6" stop-color="#100a1e"/>
      <stop offset="1" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="t-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="t-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="t-glass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <clipPath id="t-clip"><rect x="286" y="112" width="628" height="526" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#t-bg)"/>
  <ellipse cx="600" cy="140" rx="520" ry="340" fill="url(#t-purple)"/>
  <ellipse cx="1040" cy="650" rx="420" ry="300" fill="url(#t-pink)"/>

